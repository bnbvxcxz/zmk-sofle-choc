include:
  # 1. Left Half (Central)
  - board: nice_nano@2.0.0//zmk
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  # 2. Right Half (Peripheral)
  - board: nice_nano@2.0.0//zmk
    shield: sofle_right

  # 3. Settings Reset
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset